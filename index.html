<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pokeforge — intercambio ciego de equipos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230d1220' stroke='%23f6c445' stroke-width='2.5'/%3E%3Cpath d='M2 16h28' stroke='%23f6c445' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23f6c445'/%3E%3C/svg%3E">

  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <canvas id="spritefield"></canvas>
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>
    <div class="bg-scan"></div>
  </div>

  <header class="topbar">
    <a class="wordmark" href="#/inicio">
      <span class="wm-mark">
        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="30 38 200 200" fill="none" role="img" aria-labelledby="title desc">
          <title id="title">PokeForge</title>
          <defs>
            <linearGradient id="gold" x1="60" y1="38" x2="195" y2="216" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#FFF09A"/><stop offset="0.48" stop-color="#FFD43B"/><stop offset="1" stop-color="#F5A900"/>
            </linearGradient>
            <linearGradient id="blue" x1="80" y1="66" x2="190" y2="206" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#62E5FF"/><stop offset="1" stop-color="#228BFF"/>
            </linearGradient>
            <linearGradient id="lowerShell" x1="80" y1="140" x2="180" y2="216" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCEBFA"/>
            </linearGradient>
            <filter id="halo" x="10" y="10" width="238" height="244" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
              <feGaussianBlur stdDeviation="8"/>
            </filter>
            <clipPath id="ballClip"><circle cx="130" cy="137" r="79"/></clipPath>
          </defs>
          <circle cx="130" cy="137" r="91" fill="#29BFFF" opacity="0.16" filter="url(#halo)"/>
          <g clip-path="url(#ballClip)">
            <rect x="49" y="56" width="162" height="81" fill="url(#gold)"/>
            <rect x="49" y="137" width="162" height="81" fill="url(#lowerShell)"/>
            <path d="M130 69C139 83 139 91 130 100C122 108 118 115 122 123C125 130 132 133 139 129C146 125 148 117 144 111C156 120 159 132 152 141L108 141C101 132 104 119 113 108C123 97 128 85 130 69Z" fill="#17283F" opacity="0.94"/>
            <path d="M130 88C137 100 133 108 127 115C122 121 121 126 125 131C130 136 137 132 137 126C145 134 143 143 136 148L123 148C115 141 115 132 121 123C127 114 130 103 130 88Z" fill="url(#blue)"/>
            <rect x="47" y="128" width="166" height="18" fill="#101A2B"/>
            <path d="M48 128.5H212" stroke="#334C69" stroke-width="1.5"/>
            <path d="M48 145.5H212" stroke="#050A12" stroke-width="1.5"/>
          </g>
          <circle cx="130" cy="137" r="79" stroke="#101A2B" stroke-width="8"/>
          <circle cx="130" cy="137" r="22" fill="#101A2B" stroke="#101A2B" stroke-width="3"/>
          <circle cx="130" cy="137" r="14" fill="#F7FBFF" stroke="#7E9DBB" stroke-width="2"/>
          <circle cx="130" cy="137" r="6" fill="url(#blue)"/>
          <path d="M126 132C128 130 131 130 133 132" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.95"/>
          <path d="M66 58L70 48L74 58L84 62L74 66L70 76L66 66L56 62Z" fill="url(#gold)"/>
          <path d="M187 70L190 63L193 70L200 73L193 76L190 83L187 76L180 73Z" fill="url(#blue)"/>
        </svg>
      </span>
      <span class="wm-text">PokeForge</span>
      <span class="wm-sub">pokepaste lab</span>
    </a>

    <nav class="mainnav">
      <a href="#/inicio" data-nav="inicio">Inicio</a>
      <a href="#/constructor" data-nav="constructor">Enfrentamientos</a>
      <a href="#/equipos" data-nav="equipos">Mis equipos</a>
      <a href="#/unirse" data-nav="unirse">Unirse</a>
      <a href="#/dex" data-nav="dex">Pokédex</a>
      <a href="#/ajustes" data-nav="ajustes" class="nav-ico">⚙</a>
    </nav>

    <form class="quickjoin" id="quickjoin" autocomplete="off">
      <input id="quickjoin-input" maxlength="16" placeholder="código de sala">
      <button type="submit">Unirse</button>
    </form>
  </header>

  <main id="app" class="app"></main>

  <footer class="footer">
    <div class="f-left"><b>Pokeforge</b> · proyecto independiente, sin afiliación con Nintendo / Game Freak / The Pokémon Company.</div>
    <div class="f-right">Sprites: Pokémon Showdown · Datos: PokeAPI · Formato: compatible con pokepaste.es</div>
  </footer>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
</body>
</html>
